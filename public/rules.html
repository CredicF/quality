<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>校验规则维护</title><style>
body{background:#f4f6fb;color:#20304d;font:15px system-ui;margin:0}main{max-width:980px;margin:40px auto;padding:0 20px}.card,dialog{background:white;border:1px solid #dbe2ed;border-radius:12px;padding:24px;margin-top:20px}dialog{width:min(650px,85%);margin:auto}dialog::backdrop{background:#18294077}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}button,a,input,textarea{font:inherit}button{cursor:pointer;padding:9px 14px;border:1px solid #c5d2e5;background:white;border-radius:6px;color:#28446c}.primary{background:#3169e8;color:white}button:disabled{opacity:.5}article{border-top:1px solid #e1e7f0;padding:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:14px 0 5px}input:not([type=file]),textarea{width:100%;box-sizing:border-box;padding:9px}textarea{height:240px}.error{color:#a32121}</style>
<main><a href="/">← 返回设计质量检测</a><h1>校验规则维护</h1><p>每份文档可作为一组规则。新检测将采用当前保存的全部规则。</p><section class="card"><div class="bar"><h2>校验规则</h2><div><button id="add">新增规则</button> <button class="primary" id="import">导入规则文档</button></div></div><input hidden type="file" id="file" accept=".doc,.docx,.html,.htm,.md,.markdown,.txt"><p role="status" id="status"></p><div id="rows"></div></section></main>
<dialog><form><h2>维护规则</h2><label for="title">规则名称</label><input required id="title" maxlength="240"><label for="text">规则正文</label><textarea required id="text" maxlength="50000"></textarea><p class="error" role="alert" id="error"></p><button type="button" id="cancel">取消</button> <button class="primary" id="save">保存规则</button></form></dialog><script type="module" src="/rules.js"></script></html>
