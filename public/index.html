<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设计质量检测</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#20304d;font:14px system-ui}aside{position:fixed;width:220px;height:100vh;background:#142440;color:white;padding:28px}aside h2{font-size:19px}aside p{background:#2b4162;padding:14px;border-radius:8px}main{margin-left:220px;padding:32px;max-width:1500px}h1{margin-bottom:6px}small,.muted{color:#697890}.card{background:white;border:1px solid #e1e7f0;border-radius:12px;padding:24px;margin:20px 0}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}button{cursor:pointer;border:1px solid #ced8e7;background:white;color:#28446c;padding:10px 16px;border-radius:6px}button.primary{background:#3169e8;color:white;border-color:#3169e8}button:disabled{opacity:.5;cursor:wait}input,select,textarea{padding:10px;border:1px solid #cdd6e4;border-radius:6px;font:inherit;width:100%}textarea{min-height:110px}label{display:block;margin:14px 0 6px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:15px;border-bottom:1px solid #e5eaf2}th{background:#f8faff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tag{background:#eef3ff;color:#315eab;border-radius:5px;padding:5px 8px}.error{color:#b13232}dialog{border:0;border-radius:14px;width:min(850px,95vw);max-height:90vh}dialog::backdrop{background:#14244099}.finding{border:1px solid #e2e8f0;border-radius:8px;padding:20px;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fb;padding:16px}.score{font-size:40px;color:#3169e8}#notice{min-height:24px}details{margin-top:12px}@media(max-width:800px){aside{display:none}main{margin:0;padding:16px}.grid{grid-template-columns:1fr}.table{overflow:auto}}</style><aside><h2>研发全流程 AI 平台</h2><small>设计协同工作台</small><p>◇ 设计质量检测</p><small>本地工作空间</small></aside><main><div class="bar"><h1>设计质量检测</h1><a href="/rules" style="background:white;border:1px solid #ced8e7;border-radius:6px;padding:10px 16px;text-decoration:none;color:#28446c">校验规则</a></div><p class="muted">异步检查设计完整性、复用性与可实施性 · 每次检测独立保存</p><div id="notice" role="status"></div><div id="list"><div class="card"><div class="bar"><h2>检测任务</h2><button class="primary" id="new">＋ 发起新检测</button></div><p id="config" class="muted"></p><div class="grid"><input id="search" placeholder="搜索项目、文档或版本" aria-label="搜索"><select id="status" aria-label="分析状态"><option value="">全部分析状态</option><option>分析中</option><option>已完成</option><option>失败</option></select><select id="progress" aria-label="处理进度"><option value="">全部处理进度</option><option>待人工确认</option><option>整改中</option><option>待复检</option><option>已闭环</option></select></div><div class="table"><table><thead><tr><th>分析对象 / 项目</th><th>版本</th><th>创建人 / 时间</th><th>分析状态</th><th>处理进度</th><th>结果</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><div id="detail" hidden></div></main><dialog id="modal"><form id="form"><div class="bar"><h2>发起设计质量检测</h2><button type="button" id="cancel">取消</button></div><p class="muted">导入设计文档，或选择系统内已有记录，即可发起检测。</p><label for="source">文档来源</label><select id="source"><option value="upload">导入本地文档</option><option value="existing">选择系统已有文档</option></select><div id="uploadPane"><label for="file">设计文档</label><input type="file" id="file" accept=".html,.htm,.docx,.doc,.md,.markdown,.txt"><p class="muted">支持 HTML、Word（DOCX / DOC）、Markdown、TXT，最大10MB。自动提取正文，无需填写其他信息。</p></div><div id="existingPane" hidden><label for="documentSelect">设计文档</label><select id="documentSelect"><option value="">请选择设计文档</option></select><p id="documentMeta" class="muted"></p></div><p id="formError" class="error" role="alert"></p><button class="primary" id="submit">确认发起</button></form></dialog><script type="module" src="/app.js"></script></html>
